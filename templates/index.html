<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TributoSmart AI</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
      background-color: #f5f5f5;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    header img {
      height: 60px;
    }
    h1 {
      color: #1e3a8a;
      margin: 0;
    }
    form {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    input, select {
      width: 100%;
      margin-bottom: 12px;
      padding: 6px;
    }
    button {
      background: #1e3a8a;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background: #3b5998;
    }
    #resultado {
      background: #ffffff;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 2rem;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/logo.png" alt="Logo da Empresa">
    <h1>TributoSmart AI</h1>
  </header>

  <form onsubmit="enviarFormulario(event)">
    <label>CNAE: <input name="cnae" required pattern="\d{7}" title="Digite 7 números" /></label><br>
    <label>Faturamento Anual: <input name="faturamento_anual" type="number" required /></label><br>
    <label>Folha de Pagamento: <input name="folha_pagamento" type="number" required /></label><br>
    <label>Custos Operacionais: <input name="custos_operacionais" type="number" required /></label><br>
    <label>Estado: <input name="estado" maxlength="2" required pattern="[A-Z]{2}" title="Ex: SP, MG..." /></label><br>
    <label>Município: <input name="municipio" required /></label><br>
    <label>Tipo de Operação: <input name="tipo_operacao" required /></label><br>
    <label>% Vendas para outros estados: <input name="percentual" type="number" required /></label><br>
    <label>Meta de Carga (%): <input name="meta_carga_tributaria" type="number" required /></label><br>
    <label>Estados Simulação (SP, MG...): <input name="estados_simulacao" required /></label><br>
    <label>Tipo de Atividade:
      <select name="tipo_atividade" required>
        <option value="comercio">Comércio</option>
        <option value="industria">Indústria</option>
        <option value="servico">Serviço</option>
        <option value="agropecuaria">Agropecuária</option>
      </select>
    </label><br>
    <label>Número de Funcionários: <input name="num_funcionarios" type="number" required /></label><br>

    <button type="submit">Analisar</button>
    <button type="button" onclick="gerarPDF()">Gerar PDF</button>
  </form>

  <pre id="resultado"></pre>

  <script>
    let dadosGlobais = null;

    async function enviarFormulario(e) {
      e.preventDefault();
      const form = e.target;
      dadosGlobais = {
        cnae: form.cnae.value,
        faturamento_anual: parseFloat(form.faturamento_anual.value),
        folha_pagamento: parseFloat(form.folha_pagamento.value),
        custos_operacionais: parseFloat(form.custos_operacionais.value),
        estado: form.estado.value.toUpperCase(),
        municipio: form.municipio.value,
        tipo_operacao: form.tipo_operacao.value,
        percentual: parseFloat(form.percentual.value),
        meta_carga_tributaria: parseFloat(form.meta_carga_tributaria.value),
        estados_simulacao: form.estados_simulacao.value.split(',').map(e => e.trim().toUpperCase()),
        tipo_atividade: form.tipo_atividade.value,
        num_funcionarios: parseInt(form.num_funcionarios.value)
      };

      const resposta = await fetch("/analise-tributaria", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dadosGlobais)
      });

      const resultado = await resposta.json();

      document.getElementById("resultado").innerText =
        `✅ Regime: ${resultado.regime_recomendado}\n` +
        `🧾 Carga: ${resultado.carga_calculada}%\n` +
        `📍 Estado: ${resultado.estado_recomendado}\n` +
        `💡 Justificativa: ${resultado.justificativa}`;
    }

    function gerarPDF() {
      if (!dadosGlobais) {
        alert("Realize a análise primeiro para gerar o PDF.");
        return;
      }

      fetch("/gerar-pdf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dadosGlobais)
      })
        .then(response => response.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "relatorio_tributario.pdf";
          a.click();
          URL.revokeObjectURL(url);
        });
    }
  </script>
</body>
</html>
