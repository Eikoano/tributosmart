<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TributoSmart AI</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
      background-color: #f5f5f5;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    header img {
      height: 60px;
    }
    h1 {
      color: #1e3a8a;
      margin: 0;
    }
    form {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    input {
      width: 100%;
      margin-bottom: 12px;
      padding: 6px;
    }
    button {
      background: #1e3a8a;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #3b5998;
    }
    #resultado, #regimes, #simulacoes {
      background: #ffffff;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 2rem;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/logo.png" alt="TributoSmart Logo">
    <h1>TributoSmart AI</h1>
  </header>

  <form id="formulario">
    <label>CNAE: <input name="cnae" required pattern="\d{7}" title="Digite 7 números" /></label><br>
    <label>Faturamento Anual: <input name="faturamento_anual" type="number" min="1000" required /></label><br>
    <label>Folha de Pagamento: <input name="folha_pagamento" type="number" min="0" required /></label><br>
    <label>Custos Operacionais: <input name="custos_operacionais" type="number" min="0" required /></label><br>
    <label>Estado: <input name="estado" maxlength="2" required pattern="[A-Z]{2}" title="Ex: SP, MG..." /></label><br>
    <label>Município: <input name="municipio" required /></label><br>
    <label>Tipo de Operação: <input name="tipo_operacao" required /></label><br>
    <label>% Vendas para outros estados: <input name="percentual" type="number" min="0" max="100" required /></label><br>
    <label>Meta de Carga (%): <input name="meta_carga_tributaria" type="number" min="1" max="100" required /></label><br>
    <label>Estados Simulação (SP, MG...): <input name="estados_simulacao" required /></label><br>
    <button type="submit">Analisar</button>
  </form>

  <div id="resultado"></div>
  <div id="regimes"></div>
  <div id="simulacoes"></div>

  <script>
    document.getElementById("formulario").addEventListener("submit", async function(event) {
      event.preventDefault();
      const form = event.target;

      const dados = {
        cnae: form.cnae.value,
        faturamento_anual: parseFloat(form.faturamento_anual.value),
        folha_pagamento: parseFloat(form.folha_pagamento.value),
        custos_operacionais: parseFloat(form.custos_operacionais.value),
        estado: form.estado.value.toUpperCase(),
        municipio: form.municipio.value,
        tipo_operacao: form.tipo_operacao.value,
        percentual: parseFloat(form.percentual.value),
        meta_carga_tributaria: parseFloat(form.meta_carga_tributaria.value),
        estados_simulacao: form.estados_simulacao.value.split(',').map(e => e.trim().toUpperCase())
      };

      try {
        const resposta = await fetch("/analise-tributaria", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        document.getElementById("resultado").innerText =
          `🎯 Meta de Carga: ${resultado.meta_carga_tributaria}%\n\n` +
          `✅ Recomendado:\n` +
          `📍 Estado: ${resultado.estado_recomendado}\n` +
          `📊 Regime: ${resultado.regime_recomendado}\n` +
          `🧾 Carga: ${resultado.carga_calculada}%\n` +
          `💬 Justificativa: ${resultado.justificativa}`;

        const lista = document.getElementById("regimes");
        lista.innerHTML = "<h3>📊 Comparativo de Regimes:</h3><ul>";
        resultado.detalhamento_regimes.forEach(r => {
          lista.innerHTML += `<li>🧾 <strong>${r.regime}</strong>: ${r.carga}% — ${r.justificativa}</li>`;
        });
        lista.innerHTML += "</ul>";

        const blocos = document.getElementById("simulacoes");
        blocos.innerHTML = `<h3>📍 Simulações por Estado:</h3>`;
        resultado.simulacoes.forEach(s => {
          blocos.innerHTML += `<div><strong>${s.estado}</strong>: ${s.regime} - ${s.carga_efetiva}%<br><em>${s.justificativa}</em></div><hr>`;
        });

      } catch (error) {
        document.getElementById("resultado").innerText = "❌ Erro ao calcular. Verifique os campos e tente novamente.";
        console.error("Erro ao chamar a API:", error);
      }
    });
  </script>
</body>
</html>
